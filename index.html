<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>맛도리 - 유튜버가 다녀간 맛집 지도</title>
  <meta name="description" content="먹을텐데·정육왕·쯔양 등 유튜버가 다녀간 맛집을 지도에서 찾아보세요">
  <!-- 카카오톡·SNS 링크 미리보기 (이미지는 절대 주소여야 함) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="맛도리">
  <meta property="og:title" content="맛도리 - 유튜버가 다녀간 맛집 지도">
  <meta property="og:description" content="먹을텐데·정육왕·쯔양 등 유튜버가 다녀간 맛집을 지도에서 찾아보세요">
  <meta property="og:url" content="https://hoyong0729.github.io/matjip-map/">
  <meta property="og:image" content="https://hoyong0729.github.io/matjip-map/icons/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <!-- 홈 화면 앱 (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="맛도리">
  <!-- 상태바 위로 화면을 깐다 → 상단 검색창은 env(safe-area-inset-top) 만큼 내려서 가리지 않게 (style.css) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <!-- 방문자 수 (GoatCounter https://matdori.goatcounter.com). 쿠키 없음.
       보내는 것은 경로(/matjip-map/ — 주소 뒤 ?·# 는 빼고)·페이지 제목·이전 페이지·화면 크기뿐. 내 위치는 보내지 않는다.
       로컬(127.0.0.1·localhost·사설 IP·파일)에서 열면 스크립트를 아예 불러오지 않는다. 앱으로 연 경우(standalone)도 똑같이 집계 -->
  <script>
    (function () {
      var h = location.hostname;
      if (location.protocol === "file:" || /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|0\.0\.0\.0$|\[::1\]$)/.test(h)) return;
      window.goatcounter = { no_events: true, path: function () { return location.pathname; } };
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter", "https://matdori.goatcounter.com/count");
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <div class="app" id="app" data-view="map">

    <!-- 상단: 검색 · 필터 (PC: 왼쪽 패널 위, 모바일: 지도 위에 떠 있음) -->
    <header class="topbar" id="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
        </span>
        <span class="brand-name">맛도리</span>
        <span class="brand-sub">유튜버가 다녀간 맛집 지도</span>
      </div>

      <div class="search-row">
      <form class="searchbar" id="searchForm" role="search" autocomplete="off">
        <!-- 휴대폰: 위 제목 줄이 없으니 검색창 안 왼쪽에 작은 이름 (돋보기 자리) -->
        <span class="search-brand" aria-hidden="true">맛도리</span>
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m20 20-4.2-4.2M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="상호·주소 또는 장소 (예: 강남역)" aria-label="상호, 주소 또는 장소 검색">
        <button type="button" class="icon-btn" id="qClear" aria-label="검색어 지우기" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </form>
      <button type="button" class="locate-btn" id="locateBtn" aria-label="내 위치로 이동" title="내 위치">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></g><circle class="locate-core" cx="12" cy="12" r="2.6" fill="currentColor"/></svg>
      </button>
      </div>

      <button type="button" class="near-suggest" id="nearSuggest" hidden></button>

      <div class="near-bar" id="nearBar" hidden>
        <div class="near-label"><span class="near-dot"></span><span id="nearLabel"></span></div>
        <div class="radius" id="radius" role="radiogroup" aria-label="반경">
          <button type="button" data-km="0.5">500m</button>
          <button type="button" data-km="1">1km</button>
          <button type="button" data-km="3">3km</button>
          <button type="button" data-km="5">5km</button>
        </div>
        <button type="button" class="icon-btn" id="nearClear" aria-label="주변 찾기 끄기">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="filter-row">
        <label class="select-pill">
          <span class="sr-only">지역</span>
          <select id="region"></select>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
        </label>
        <!-- 채널(유튜버) 여러 개 선택: 데이터에 있는 프로그램으로 자동 목록화 -->
        <div class="channel-pick" id="channelPick">
          <button type="button" class="pill-btn" id="channelBtn" aria-haspopup="true" aria-expanded="false">
            <span id="channelLabel">채널</span>
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="channel-pop" id="channelPop" role="group" aria-label="채널" hidden></div>
        </div>
        <!-- 유명 유튜버만 (channels.csv famous=1 채널 영상이 있는 가게만). 기본 꺼짐. 휴대폰은 ★ 만 -->
        <button type="button" class="pill-btn famous-btn" id="famousBtn" aria-pressed="false" title="유명 유튜버 맛집만 보기">
          <span class="famous-star" aria-hidden="true">★</span><span class="famous-label">유명 유튜버만</span>
        </button>
        <div class="chips" id="chips" role="group" aria-label="음식 종류"></div>
        <div class="seg" id="viewSeg" role="tablist" aria-label="보기">
          <button type="button" data-view="map" role="tab">지도</button>
          <button type="button" data-view="list" role="tab">목록</button>
        </div>
      </div>
    </header>

    <!-- 목록 패널 (PC: 왼쪽 400px, 모바일: 아래에서 끌어올리는 시트) -->
    <aside class="panel" id="panel" aria-label="식당 목록">
      <div class="sheet-grip" id="sheetGrip" aria-hidden="true"><span></span></div>
      <div class="list-meta" id="listMeta">
        <span><b id="count">0</b>곳</span>
        <span class="sort" id="sortLabel">최신 영상 순</span>
        <button type="button" class="subset-clear" id="subsetClear" hidden>전체 보기</button>
        <div class="me-radius" id="meRadius" role="radiogroup" aria-label="내 위치 주변 반경" hidden>
          <button type="button" data-km="1">1km</button>
          <button type="button" data-km="3">3km</button>
          <button type="button" data-km="5">5km</button>
          <button type="button" data-km="10">10km</button>
          <button type="button" data-km="0">전체</button>
        </div>
      </div>
      <div class="scroll" id="scroll">
        <ul class="list" id="list"></ul>
        <div class="empty" id="empty" hidden>
          <p class="empty-title">조건에 맞는 식당이 없어요</p>
          <p class="empty-sub">필터를 줄이거나 반경을 넓혀 보세요</p>
        </div>
      </div>
      <section class="detail" id="detail" hidden aria-live="polite"></section>
      <!-- 제작자 표시 (PC: 목록 패널 맨 아래. 휴대폰은 '마지막 업데이트' 칸 둘째 줄 — app.js) -->
      <p class="credit credit-panel">개발자 유니주니 · 후원 강남오빠(안호성)</p>
    </aside>

    <main class="map-wrap" id="mapWrap">
      <div id="map" aria-label="지도"></div>
      <div class="updated" id="updated"></div>
      <div class="zoom" id="zoom" hidden>
        <button type="button" data-zoom="-1" aria-label="확대">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" data-zoom="1" aria-label="축소">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 12h14"/></svg></button>
      </div>
      <div class="map-message" id="mapMessage" hidden></div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <!-- 앱 설치 안내 (휴대폰, 시트가 접혀 있을 때만 그 바로 위). 안드로이드: [설치] → 설치 창 / 아이폰: 공유 → 홈 화면에 추가 -->
    <div class="install-bar" id="installBar" role="region" aria-label="앱 설치 안내" hidden>
      <img class="install-icon" src="icons/icon-192.png" alt="" width="36" height="36">
      <div class="install-text" id="installText"></div>
      <button type="button" class="install-go" id="installGo" hidden>설치</button>
      <button type="button" class="install-close" id="installClose">닫기</button>
    </div>
  </div>

  <script src="config.js" onerror="window.MATJIP_CONFIG = window.MATJIP_CONFIG || {}"></script>
  <script src="js/app.js"></script>
</body>
</html>
